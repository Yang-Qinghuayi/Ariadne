name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test & Package (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Run unit tests
        run: swift test

      - name: Build Universal .app, .dmg & .zip
        run: ./scripts/package.sh --build "${{ github.run_number }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ariadne-macOS-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
